name: Build with Maven
on:
  push:
      branches: [ main ]
jobs:
  build:
    runs-on:  ubuntu-latest
    steps:
      - name: check repo
        uses: actions/check@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Maven build
        run: mvn clean test

      - name: Run tests
        run: mvn clean test
        
